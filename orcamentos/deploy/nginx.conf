# Nginx na frente do app (para usar domínio próprio + HTTPS grátis com certbot).
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/orcamentos
#   sudo ln -s /etc/nginx/sites-available/orcamentos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seu-dominio.com.br
server {
    listen 80;
    server_name seu-dominio.com.br;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
