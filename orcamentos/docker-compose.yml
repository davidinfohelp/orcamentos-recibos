# Sobe o sistema + banco PostgreSQL na VPS, sempre ligado.
# Uso:  cp .env.example .env  (edite as senhas)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orcamentos
      POSTGRES_USER: orcamentos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamentos -d orcamentos"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped        # volta sozinho se cair ou se a VPS reiniciar
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/orcamentos
      DB_USER: orcamentos
      DB_PASSWORD: ${DB_PASSWORD}
      CODIGO_CONVITE: ${CODIGO_CONVITE:?defina CODIGO_CONVITE no arquivo .env}
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx384m}
    ports:
      - "${PORTA:-8080}:8080"

volumes:
  dbdata:
