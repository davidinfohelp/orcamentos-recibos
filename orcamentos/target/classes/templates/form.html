<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo documento</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#1b1f24}
h1{font-size:22px}
table{width:100%;border-collapse:collapse;margin:12px 0}
td,th{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}
th{background:#f2f4f7}
label{display:block;font-size:12px;color:#555;margin-bottom:4px}
input,select,textarea{padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit;width:100%;box-sizing:border-box}
button,.btn{padding:8px 14px;border:0;border-radius:6px;background:#1f6feb;color:#fff;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.s{background:#fff;color:#1b1f24;border:1px solid #bbb;padding:7px 12px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
@media(max-width:600px){table{display:block;overflow-x:auto}input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<h1 th:text="${d.tipo.name()=='ORCAMENTO' ? 'Novo orçamento' : 'Novo recibo'}"></h1>
<form th:action="@{/salvar}" th:object="${d}" method="post">
  <input type="hidden" th:field="*{tipo}">
  <input type="hidden" th:field="*{status}">
  <div class="g">
    <div><label>Cliente *</label><input th:field="*{cliente}" required></div>
    <div><label>CPF / CNPJ</label><input th:field="*{cpfCnpj}" inputmode="numeric" maxlength="18" placeholder="Somente números"></div>
    <div><label>Telefone</label><input th:field="*{telefone}"></div>
    <div><label>Data</label><input type="date" th:field="*{data}"></div>
    <div th:if="${d.tipo.name()=='RECIBO'}"><label>Forma de pagamento</label><input th:field="*{formaPagamento}" placeholder="Pix, dinheiro, cartão..."></div>
  </div>
  <table>
    <tr><th>Descrição</th><th style="width:90px">Qtd</th><th style="width:140px">Valor unit. (R$)</th></tr>
    <tr th:each="i : ${#numbers.sequence(0,7)}">
      <td><input th:field="*{itens[__${i}__].descricao}"></td>
      <td><input type="number" min="1" th:field="*{itens[__${i}__].quantidade}"></td>
      <td><input type="number" step="0.01" min="0" th:field="*{itens[__${i}__].valorUnitario}"></td>
    </tr>
  </table>
  <label>Observações</label>
  <textarea th:field="*{observacoes}"></textarea>
  <p><button>Salvar</button> <a class="btn s" th:href="@{/}">Cancelar</a></p>
</form>
<script>
(function () {
  var c = document.getElementById('cpfCnpj');
  c.addEventListener('input', function () {
    var v = c.value.replace(/\D/g, '').slice(0, 14), r;
    if (v.length <= 11) {
      r = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    } else {
      r = v.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
           .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
    }
    c.value = r;
  });
})();
</script>
</body>
</html>
