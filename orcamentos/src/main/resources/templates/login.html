<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamentos e Recibos</title><style>body{font-family:system-ui,sans-serif;max-width:380px;margin:0 auto;padding:24px 16px;color:#1b1f24}h1{font-size:22px}label{display:block;font-size:13px;color:#555;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;font:inherit;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:6px;background:#1f6feb;color:#fff;font:inherit;cursor:pointer}.e{color:#cf222e;margin-top:12px}.ok{color:#1a7f37;margin-top:12px}a{color:#1f6feb}</style></head><body><img th:src="@{/logo.png}" alt="" style="max-height:70px;margin-bottom:8px" onerror="this.style.display='none'">
<h1>Entrar</h1>
<p class="e" th:if="${param.error}">Usuário ou senha incorretos.</p>
<p class="ok" th:if="${param.registrado}">Conta criada! Faça seu login.</p>
<p class="ok" th:if="${param.saiu}">Você saiu do sistema.</p>
<form th:action="@{/login}" method="post">
<label>Usuário</label><input name="username" autocomplete="username" autofocus required>
<label>Senha</label><input name="password" type="password" autocomplete="current-password" required>
<button>Entrar</button></form>
<p>Não tem conta? <a th:href="@{/registro}">Criar conta</a></p></body></html>
