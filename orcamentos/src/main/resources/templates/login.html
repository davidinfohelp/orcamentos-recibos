<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Orçamentos e Recibos</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
  <div class="auth">
    <p><a class="marca" th:href="@{/}" style="color:var(--txt)">← Orçamentos e Recibos</a></p>
    <div class="card">
      <h1>Entrar</h1>
      <p class="e" th:if="${param.error}">Usuário ou senha incorretos.</p>
      <p class="ok" th:if="${param.registrado}">Conta criada! Faça seu login.</p>
      <p class="ok" th:if="${param.saiu}">Você saiu do sistema.</p>
      <form th:action="@{/login}" method="post">
        <label>Usuário</label><input name="username" autocomplete="username" autofocus required>
        <label>Senha</label><input name="password" type="password" autocomplete="current-password" required>
        <button>Entrar</button>
      </form>
      <p class="mut">Não tem conta? <a th:href="@{/registro}">Criar conta</a></p>
    </div>
  </div>
</div>
</body>
</html>
