<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo documento</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
  <div class="topo">
    <h1 th:text="${d.tipo.name()=='ORCAMENTO' ? 'Novo orçamento' : 'Novo recibo'}"></h1>
    <span class="chip" th:if="${!#strings.isEmpty(empresa.nome)}">Emitindo como <b th:text="${empresa.nome}"></b> · <a th:href="@{/empresa}">alterar</a></span>
    <span class="chip" th:if="${#strings.isEmpty(empresa.nome)}">Empresa não configurada · <a th:href="@{/empresa}">configurar</a></span>
  </div>

  <form id="docForm" th:action="@{/salvar}" th:object="${d}" method="post">
    <input type="hidden" th:field="*{tipo}">
    <input type="hidden" th:field="*{status}">
    <div class="card">
      <div class="g">
        <div><label>Cliente *</label><input th:field="*{cliente}" required></div>
        <div><label>CPF / CNPJ</label><input th:field="*{cpfCnpj}" inputmode="numeric" maxlength="18" placeholder="Somente números"></div>
        <div><label>Telefone</label><input th:field="*{telefone}"></div>
        <div><label>Data</label><input type="date" th:field="*{data}"></div>
        <div th:if="${d.tipo.name()=='RECIBO'}"><label>Forma de pagamento</label><input th:field="*{formaPagamento}" placeholder="Pix, dinheiro, cartão..."></div>
      </div>
    </div>

    <div class="rolar">
      <table style="min-width:640px">
        <tr><th>Descrição</th><th style="width:150px">Serviço ou item</th><th style="width:90px">Qtd</th><th style="width:150px">Valor unit. (R$)</th></tr>
        <tr th:each="i : ${#numbers.sequence(0,7)}">
          <td><input th:field="*{itens[__${i}__].descricao}"></td>
          <td>
            <select th:field="*{itens[__${i}__].tipo}">
              <option value="SERVICO">Serviço</option>
              <option value="ITEM">Item</option>
            </select>
          </td>
          <td><input type="number" min="1" th:field="*{itens[__${i}__].quantidade}"></td>
          <td><input type="number" step="0.01" min="0" th:field="*{itens[__${i}__].valorUnitario}"></td>
        </tr>
      </table>
    </div>
    <p class="r" style="margin:0 0 12px"><span class="mut">Total:</span> <b style="font-size:20px">R$ <span id="totalLive">0,00</span></b></p>

    <label>Observações</label>
    <textarea th:field="*{observacoes}" rows="3"></textarea>
    <p><button>Salvar</button> <a class="btn s" th:href="@{/}">Cancelar</a></p>
  </form>
</div>
<script>
(function () {
  var f = document.getElementById('docForm');
  var tot = document.getElementById('totalLive');
  function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
  function calc() {
    var soma = 0;
    for (var i = 0; i < 8; i++) {
      var d = f.elements['itens' + '[' + i + '].descricao'];
      var q = f.elements['itens' + '[' + i + '].quantidade'];
      var v = f.elements['itens' + '[' + i + '].valorUnitario'];
      if (d && d.value.trim() !== '') soma += (q && q.value !== '' ? num(q.value) : 1) * (v ? num(v.value) : 0);
    }
    tot.textContent = soma.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  f.addEventListener('input', calc);
  calc();

  var c = document.getElementById('cpfCnpj');
  c.addEventListener('input', function () {
    var v = c.value.replace(/\D/g, '').slice(0, 14), r;
    if (v.length <= 11) {
      r = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    } else {
      r = v.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
           .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
    }
    c.value = r;
  });
})();
</script>
</body>
</html>
