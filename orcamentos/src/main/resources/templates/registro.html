<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta — Orçamentos e Recibos</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
  <div class="auth">
    <p><a class="marca" th:href="@{/}" style="color:var(--txt)">← Orçamentos e Recibos</a></p>
    <div class="card">
      <h1>Criar conta</h1>
      <p class="e" th:if="${erro}" th:text="${erro}"></p>
      <form th:action="@{/registro}" method="post">
        <label>Código de convite</label>
        <input name="codigo" autocomplete="off" required>
        <label>Usuário (minúsculas, números, ponto, hífen ou _)</label>
        <input name="username" th:value="${username}" autocomplete="username" required>
        <label>Senha (mínimo 8 caracteres)</label>
        <input name="password" type="password" autocomplete="new-password" required>
        <label>Repita a senha</label>
        <input name="confirma" type="password" autocomplete="new-password" required>
        <button>Criar conta</button>
      </form>
      <p class="mut">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
  </div>
</div>
</body>
</html>
