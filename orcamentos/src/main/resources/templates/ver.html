<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#1b1f24}
h1{font-size:22px}
table{width:100%;border-collapse:collapse;margin:12px 0}
td,th{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}
th{background:#f2f4f7}
input{padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit;box-sizing:border-box}
button,.btn{padding:8px 14px;border:0;border-radius:6px;background:#1f6feb;color:#fff;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.s{background:#fff;color:#1b1f24;border:1px solid #bbb;padding:7px 12px;font-size:14px}
form.i{display:inline}
.r{text-align:right}
.no{margin:8px 0}
@media print{.no{display:none}}
</style>
</head>
<body th:data-tel="${d.telefone}" th:data-cliente="${d.cliente}">

<div class="no">
  <a class="btn s" th:href="@{/}">← Voltar</a>
  <button type="button" onclick="window.print()">Imprimir / salvar PDF</button>
  <form class="i" th:if="${d.tipo.name()=='ORCAMENTO'}" th:action="@{/converter/{id}(id=${d.id})}" method="post">
    <button class="s">Converter em recibo</button>
  </form>
</div>

<div class="no">
  <input id="email" type="email" placeholder="E-mail do cliente" style="width:240px">
  <a id="lnkEmail" class="btn s" href="#">Enviar por e-mail</a>
  <a id="lnkZap" class="btn s" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
</div>

<img th:src="@{/logo.png}" alt="" style="max-height:80px;margin-bottom:8px" onerror="this.style.display='none'">
<h1 id="titulo" th:text="(${d.tipo.name()=='ORCAMENTO'} ? 'ORÇAMENTO' : 'RECIBO') + ' nº ' + ${d.numero}"></h1>

<p>Data: <span th:text="${#temporals.format(d.data,'dd/MM/yyyy')}"></span><br>
   Cliente: <b th:text="${d.cliente}"></b> · Tel.: <span th:text="${d.telefone}"></span>
   <span th:if="${d.cpfCnpj != null and !d.cpfCnpj.isBlank()}"><br>CPF/CNPJ: <span th:text="${d.cpfCnpj}"></span></span></p>

<table id="itens">
  <tr><th>Descrição</th><th>Qtd</th><th class="r">Unitário</th><th class="r">Subtotal</th></tr>
  <tr th:each="i : ${d.itens}">
    <td th:text="${i.descricao}"></td>
    <td th:text="${i.quantidade}"></td>
    <td class="r" th:text="${#numbers.formatDecimal(i.valorUnitario,1,'POINT',2,'COMMA')}"></td>
    <td class="r" th:text="${#numbers.formatDecimal(i.subtotal(),1,'POINT',2,'COMMA')}"></td>
  </tr>
  <tr><td colspan="3" class="r"><b>Total</b></td>
      <td class="r"><b th:text="'R$ ' + ${#numbers.formatDecimal(d.total(),1,'POINT',2,'COMMA')}"></b></td></tr>
</table>

<p th:if="${d.tipo.name()=='RECIBO'}">Recebi de <b th:text="${d.cliente}"></b> a quantia de
  <b th:text="'R$ ' + ${#numbers.formatDecimal(d.total(),1,'POINT',2,'COMMA')}"></b><span th:if="${d.formaPagamento!=null and !d.formaPagamento.isBlank()}" th:text="', via ' + ${d.formaPagamento}"></span>, referente aos itens acima.</p>
<p th:if="${d.tipo.name()=='ORCAMENTO'}">Orçamento válido por 15 dias.</p>
<p th:text="${d.observacoes}"></p>
<p style="margin-top:60px;border-top:1px solid #000;width:300px;padding-top:4px;text-align:center">Assinatura</p>
<p class="no" style="color:#999;font-size:11px">versao-3</p>

<script>
(function () {
  var body = document.body;
  var tel = (body.getAttribute('data-tel') || '').replace(/\D/g, '');
  var cliente = body.getAttribute('data-cliente') || '';
  var titulo = document.getElementById('titulo').innerText;

  var texto = 'Olá, ' + cliente + '! Segue o documento:\n\n' + titulo + '\n';
  var linhas = document.querySelectorAll('#itens tr');
  for (var i = 1; i < linhas.length; i++) {
    var cels = linhas[i].cells, partes = [];
    for (var j = 0; j < cels.length; j++) partes.push(cels[j].innerText.trim());
    texto += '- ' + partes.join(' | ') + '\n';
  }
  texto += '\nQualquer dúvida, estou à disposição.';

  var zap = document.getElementById('lnkZap');
  if (tel) {
    if (tel.length <= 11) tel = '55' + tel;
    zap.href = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(texto);
  } else {
    zap.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
  }

  var campo = document.getElementById('email');
  var lnk = document.getElementById('lnkEmail');
  function atualizar() {
    lnk.href = 'mailto:' + campo.value.trim() + '?subject=' + encodeURIComponent(titulo) + '&body=' + encodeURIComponent(texto);
  }
  campo.addEventListener('input', atualizar);
  atualizar();
})();
</script>
</body>
</html>
